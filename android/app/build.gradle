plugins {
    id 'com.android.application'
}

// 版本号唯一来源：根目录 CMakeLists.txt 的 KRKRSDL3_VERSION
def krkrVersionMatch = rootProject.file('../CMakeLists.txt').text =~ /(?m)^\s*set\(KRKRSDL3_VERSION\s+"([^"]+)"\)/
if (!krkrVersionMatch.find()) {
    throw new GradleException("CMakeLists.txt 中未找到 KRKRSDL3_VERSION")
}
def krkrVersion = krkrVersionMatch.group(1)
def krkrVersionParts = krkrVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)(?:\.(\d+))?)?$/
if (!krkrVersionParts.matches()) {
    throw new GradleException("非法版本号: ${krkrVersion}")
}
def krkrMajor = krkrVersionParts.group(1) as int
def krkrMinor = krkrVersionParts.group(2) as int
def krkrPatch = krkrVersionParts.group(3) as int
def krkrStage = krkrVersionParts.group(4)
def krkrStageNum = krkrVersionParts.group(5) ? krkrVersionParts.group(5) as int : 0
def krkrStageRank = [alpha: 1, beta: 2, rc: 3].get(krkrStage) ?: 9
def krkrVersionCode = krkrMajor * 10000000 + krkrMinor * 100000 + krkrPatch * 1000 + krkrStageRank * 100 + krkrStageNum

android {
    namespace 'org.tvp.krkrsdl3'
    compileSdk 35
    ndkVersion '28.0.13004108'
    buildToolsVersion '34.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "org.tvp.krkrsdl3"
        minSdk 21
        targetSdkVersion 35
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-28', '-DANDROID=true'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        versionCode krkrVersionCode
        versionName krkrVersion
        resValue "string", "app_version", "v${krkrVersion}"
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java','../../cpp/environ/android']
            res.srcDirs = ['res']
            assets.srcDirs = ['../../Res']
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            version '3.31.1'
            buildStagingDirectory '../../out/android'
            path '../../CMakeLists.txt'
        }
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${namespace}_v${defaultConfig.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}